services:
  postgres:
    image: postgres:16-alpine
    container_name: mundo-invest-postgres
    environment:
      POSTGRES_USER: mundo
      POSTGRES_PASSWORD: mundo
      POSTGRES_DB: mundo_invest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundo -d mundo_invest"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
